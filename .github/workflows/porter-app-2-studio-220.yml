"on":
    push:
        branches:
            - main
name: Deploy to studio-220
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
              with:
                tagged_release: v0.69.14
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APPLICATION_ID: f8f107a3-3e7e-4179-b371-a058a7bee435
                PORTER_CLUSTER: "2"
                PORTER_DEPLOYMENT_TARGET_ID: 4ad6e0ea-bea7-4228-bea9-71a7508e5dda
                PORTER_HOST: https://cathy.withporter.run
                PORTER_PROJECT: "1"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}

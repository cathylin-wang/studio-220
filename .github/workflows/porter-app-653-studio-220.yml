"on":
    push:
        branches:
            - main
name: Deploy to studio-220
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: studio-220
                PORTER_CLUSTER: "653"
                PORTER_DEPLOYMENT_TARGET_ID: d8086475-0696-4c69-b0c0-458c46696207
                PORTER_HOST: https://dashboard.internal-tools.porter.run
                PORTER_PROJECT: "519"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_519_749 }}

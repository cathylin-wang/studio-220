"on":
    push:
        branches:
            - main
name: Deploy to studio-220-1
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: studio-220-1
                PORTER_CLUSTER: "2"
                PORTER_DEPLOYMENT_TARGET_ID: 39190960-39ce-41f8-8a04-9f9abc322928
                PORTER_HOST: https://cathy.withporter.run
                PORTER_PROJECT: "1"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_1_1183349950 }}

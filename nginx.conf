server {
    listen 80;

    # Redirect HTTP to HTTPS (Porter terminates TLS at the load balancer
    # and forwards the original protocol via X-Forwarded-Proto)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
